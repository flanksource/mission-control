apiVersion: mission-control.flanksource.com/v1
kind: Role
metadata:
  name: viewer
  namespace: mission-control-builtin
spec:
  description: Reads the resources people operate on, and nothing that configures access, holds credentials or exposes Mission Control's internals
  rules:
    - name: read-configs
      action: read
      resource:
        scopeRef: all-configs
    - name: read-components
      action: read
      resource:
        scopeRef: all-components
    - name: read-checks
      action: read
      resource:
        scopeRef: all-checks
    - name: read-canaries
      action: read
      resource:
        scopeRef: all-canaries
    - name: read-playbooks
      action: read
      resource:
        scopeRef: all-playbooks
    - name: read-applications
      action: read
      resource:
        scopeRef: all-applications
    - name: read-people
      action: read
      resource:
        scopeRef: all-people
    - name: read-teams
      action: read
      resource:
        scopeRef: all-teams
