apiVersion: mission-control.flanksource.com/v1
kind: Team
metadata:
  name: admins
  namespace: mission-control-builtin
spec: {}
---
apiVersion: mission-control.flanksource.com/v1
kind: RoleBinding
metadata:
  name: admins
  namespace: mission-control-builtin
spec:
  description: Members of the admins team are admins
  role: admin
  subjects:
    teams:
      - admins
---
apiVersion: mission-control.flanksource.com/v1
kind: RoleBinding
metadata:
  name: plugin-admins
  namespace: mission-control-builtin
spec:
  description: Members of the admins team may invoke every plugin operation. Shipped only while plugin-admin is.
  role: plugin-admin
  subjects:
    teams:
      - admins
