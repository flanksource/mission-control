# Objects shipped with Mission Control (specs/authorization/overview.md, "Shipped Roles" and "Configured bindings").
# Mission Control writes them to its database on startup. plugin-admin isn't here: it's built from the operations of the
# installed plugins, and written again whenever they change. They can't be changed through the API or Kubernetes.
# The admins team's members are managed as usual; only the team itself and its bindings are shipped.
#
# There's one Scope per resource type, all-<type>, with a single whole-type target. Roles anyone creates in this
# namespace may use them, so each always selects exactly its type: a new type gets a new Scope, never a wider one.
apiVersion: mission-control.flanksource.com/v1
kind: Scope
metadata:
  name: all-configs
  namespace: mission-control-builtin
spec:
  description: Every config
  targets:
    - config:
        name: "*"
---
apiVersion: mission-control.flanksource.com/v1
kind: Scope
metadata:
  name: all-components
  namespace: mission-control-builtin
spec:
  description: Every component
  targets:
