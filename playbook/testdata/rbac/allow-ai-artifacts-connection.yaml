apiVersion: mission-control.flanksource.com/v1
kind: Scope
metadata:
  name: allow-ai-artifacts-connection
  namespace: default
spec:
  targets:
    - connection:
        name: artifacts
        namespace: default
---
apiVersion: mission-control.flanksource.com/v1
kind: Role
metadata:
  name: allow-ai-artifacts-connection
  namespace: default
spec:
  description: allow playbook default/diagnose-resource to use connection default/artifacts
  rules:
    - name: use-connections
      action: connection:use
      resource:
        scopeRef: allow-ai-artifacts-connection
---
apiVersion: mission-control.flanksource.com/v1
kind: RoleBinding
metadata:
  name: allow-ai-artifacts-connection
  namespace: default
spec:
  role: allow-ai-artifacts-connection
  subjects:
    playbooks:
      - name: diagnose-resource
        namespace: default
