apiVersion: mission-control.flanksource.com/v1
kind: Permission
metadata:
  name: allow-playbook-artifacts
spec:
  description: allow playbook default/diagnose-resource to use connection default/artifacts
  subject:
    playbook: default/diagnose-resource
  actions:
    - connection:use
  object:
    connections:
      - name: artifacts
        namespace: default
