apiVersion: mission-control.flanksource.com/v1
kind: Scope
metadata:
  name: all-views
  namespace: default
spec:
  targets:
    - view:
        name: "*"
---
apiVersion: mission-control.flanksource.com/v1
kind: Role
metadata:
  name: read-views
  namespace: default
spec:
  description: allow reading every view
  rules:
    - name: read-views
      action: read
      resource:
        scopeRef: all-views
---
apiVersion: mission-control.flanksource.com/v1
kind: RoleBinding
metadata:
  name: "{{playbookName}}-read-views"
  namespace: default
spec:
  description: allow playbook to read the views it reports on
  role: read-views
  subjects:
    playbooks:
      - name: "{{playbookName}}"
        namespace: "{{playbookNamespace}}"
