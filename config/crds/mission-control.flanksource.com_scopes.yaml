---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: scopes.mission-control.flanksource.com
spec:
  group: mission-control.flanksource.com
  names:
    kind: Scope
    listKind: ScopeList
    plural: scopes
    singular: scope
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Scope selects resources, of one or more types, for access control
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              description:
                description: Description provides a brief explanation of what this
                  scope covers
                type: string
              targets:
                description: |-
                  Targets select the resources of the Scope.
                  A Scope is the union of what its targets select: a resource belongs to the Scope
                  when a target of the resource's type matches it.
                items:
                  description: |-
                    ScopeTarget selects resources of exactly one type. Scope owns the authoring fields;
                    duty's query options and state filters must not enter the authorization language.
                  properties:
                    canary:
                      description: ScopeCanarySelector selects canaries by identity
                        and ownership.
                      minProperties: 1
                      properties:
                        agent:
                          minLength: 1
                          type: string
                        id:
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                          type: string
                        labelSelector:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                        namespace:
                          minLength: 1
                          type: string
                      type: object
                    check:
                      description: ScopeLabelledSelector selects components and checks.
                      minProperties: 1
                      properties:
                        agent:
                          minLength: 1
                          type: string
                        id:
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                          type: string
                        labelSelector:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                        namespace:
                          minLength: 1
                          type: string
                        types:
                          items:
                            minLength: 1
                            type: string
                          minItems: 1
                          type: array
                      type: object
                    component:
                      description: ScopeLabelledSelector selects components and checks.
                      minProperties: 1
                      properties:
                        agent:
                          minLength: 1
                          type: string
                        id:
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                          type: string
                        labelSelector:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                        namespace:
                          minLength: 1
                          type: string
                        types:
                          items:
                            minLength: 1
                            type: string
                          minItems: 1
                          type: array
                      type: object
                    config:
                      description: ScopeConfigSelector selects configs by identity
                        and ownership, never by current state.
                      minProperties: 1
                      properties:
                        agent:
                          minLength: 1
                          type: string
                        id:
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                          type: string
                        labelSelector:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                        namespace:
                          minLength: 1
                          type: string
                        tagSelector:
                          minLength: 1
                          type: string
                        types:
                          items:
                            minLength: 1
                            type: string
                          minItems: 1
                          type: array
                      type: object
                    connection:
                      description: ScopeConnectionSelector selects connections by
                        identity and type.
                      minProperties: 1
                      properties:
                        id:
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                          type: string
                        name:
                          minLength: 1
                          type: string
                        namespace:
                          minLength: 1
                          type: string
                        types:
                          items:
                            minLength: 1
                            type: string
                          minItems: 1
                          type: array
                      type: object
                    playbook:
                      description: ScopePlaybookRef selects playbooks by id, name
                        or namespace.
                      minProperties: 1
                      properties:
                        id:
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                          type: string
                        name:
                          minLength: 1
                          type: string
                        namespace:
                          minLength: 1
                          type: string
                      type: object
                    view:
                      description: ScopeViewRef selects views by id, name or namespace.
                      minProperties: 1
                      properties:
                        id:
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                          type: string
                        name:
                          minLength: 1
                          type: string
                        namespace:
                          minLength: 1
                          type: string
                      type: object
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of config, component, check, playbook, canary,
                      view, or connection must be specified
                    rule: '[has(self.config), has(self.component), has(self.check),
                      has(self.playbook), has(self.canary), has(self.view), has(self.connection)].filter(x,
                      x).size() == 1'
                maxItems: 10
                minItems: 1
                type: array
            required:
            - targets
            type: object
          status:
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the Scope's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the generation observed by the
                  controller
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
