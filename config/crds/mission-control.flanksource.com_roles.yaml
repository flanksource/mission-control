---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: roles.mission-control.flanksource.com
spec:
  group: mission-control.flanksource.com
  names:
    kind: Role
    listKind: RoleList
    plural: roles
    singular: role
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Role is a named set of rules, each allowing an action on the resources selected by a Scope,
          optionally on the targets selected by another Scope.
          A role grants nothing on its own: a RoleBinding grants it to subjects.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              description:
                description: Description provides a brief explanation of the role.
                type: string
              rules:
                description: Rules of the role. Rules only allow.
                items:
                  properties:
                    action:
                      description: Action is the action the rule allows, e.g. read
                        or playbook:run.
                      maxLength: 253
                      minLength: 1
                      type: string
                    deny:
                      description: |-
                        Deny is refused: rules only allow. It's kept so that a Role setting it is rejected rather than
                        stored without it, which would allow what it was written to deny. false is accepted and ignored.
                      type: boolean
                    description:
                      description: Description provides a brief explanation of the
                        rule.
                      type: string
                    name:
                      description: Name identifies the rule within the role.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    resource:
                      description: |-
                        Resource is the Scope selecting the resources the action is performed on.
                        Omitted for the actions that take no resource: person:manage, access:review, mcp:use, property:manage, event:read and job:read.
                      properties:
                        scopeRef:
                          description: ScopeRef is the Scope's name, in the namespace
                            of the Role or RoleBinding, or namespace/name.
                          maxLength: 317
                          minLength: 1
                          pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?/)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                      - scopeRef
                      type: object
                    target:
                      description: |-
                        Target is the Scope selecting what the action is performed on the resource with,
                        e.g. the configs a playbook runs on. Only actions that take a target accept it.
                        Without a target, the rule only matches operations without one.
                      properties:
                        scopeRef:
                          description: ScopeRef is the Scope's name, in the namespace
                            of the Role or RoleBinding, or namespace/name.
                          maxLength: 317
                          minLength: 1
                          pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?/)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                      - scopeRef
                      type: object
                  required:
                  - action
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: action must be a known action or invoke:<plugin>:<operation>,
                      without patterns
                    rule: self.action in ['read','create','update','delete','playbook:run','playbook:approve','playbook:cancel','mcp:run','connection:use','person:manage','access:review','mcp:use','property:manage','event:read','job:read']
                      || self.action.matches('^invoke:[^:*!, ]+:[^:*!, ]+$')
                  - message: person:manage, access:review, mcp:use, property:manage,
                      event:read and job:read take no resource; every other action
                      needs one
                    rule: has(self.resource) != (self.action in ['person:manage','access:review','mcp:use','property:manage','event:read','job:read'])
                  - message: 'deny isn''t supported on a rule: rules only allow, and
                      a RoleBinding with deny refuses a role'
                    rule: '!has(self.deny) || self.deny != true'
                  - message: only playbook:run, playbook:approve and playbook:cancel
                      take a target
                    rule: '!has(self.target) || self.action in [''playbook:run'',''playbook:approve'',''playbook:cancel'']'
                maxItems: 200
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - rules
            type: object
          status:
            properties:
              bindingsWithUnappliedRules:
                description: |-
                  BindingsWithUnappliedRules lists the RoleBindings of the role that some of its allow rules don't apply through,
                  because their constraint can't narrow them. It's information, not validation: it doesn't affect whether the role is valid.
                items:
                  description: BindingUnappliedRules is a RoleBinding whose AllRulesApply
                    condition is False.
                  properties:
                    name:
                      description: Name of the RoleBinding.
                      type: string
                    namespace:
                      description: Namespace of the RoleBinding, which needn't be
                        the role's.
                      type: string
                    rules:
                      description: Rules of the role that don't apply through the
                        binding.
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  - namespace
                  - rules
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
