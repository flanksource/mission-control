---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: externalidentityproviders.mission-control.flanksource.com
spec:
  group: mission-control.flanksource.com
  names:
    kind: ExternalIdentityProvider
    listKind: ExternalIdentityProviderList
    plural: externalidentityproviders
    singular: externalidentityprovider
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          ExternalIdentityProvider lets an external application authenticate its users to Mission Control
          with JWTs signed by its own issuer.

          A user is represented by a federated person (keyed by <provider>:<username>), and their access
          comes only from RoleBindings whose oidc subjects match the claims of their token.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              algorithms:
                description: Algorithms accepted for token signatures. Defaults to
                  RS256 and ES256.
                items:
                  enum:
                  - RS256
                  - RS384
                  - RS512
                  - PS256
                  - PS384
                  - PS512
                  - ES256
                  - ES384
                  - ES512
                  - EdDSA
                  type: string
                type: array
              audience:
                description: Audience must be one of the aud claims of accepted tokens,
                  usually the Mission Control URL.
                minLength: 1
                type: string
              claims:
                description: |-
                  Claims maps token claims to the federated person.
                  RoleBindings can match any claim of the token.
                properties:
                  email:
                    description: |-
                      Email is the claim with the user's email.
                      It's only displayed and never used to match Mission Control users.
                    type: string
                  name:
                    description: Name is the claim with the user's display name.
                    type: string
                  username:
                    description: |-
                      Username is the claim that uniquely and stably identifies the user in the external application.
                      Defaults to sub.
                    type: string
                type: object
              disabled:
                description: Disabled rejects every token from this provider.
                type: boolean
              issuer:
                description: Issuer must exactly match the iss claim of accepted tokens.
                minLength: 1
                pattern: ^(https://.+|http://(localhost|127(\.[0-9]{1,3}){3}|\[::1\])(:[0-9]+)?([/?#].*)?)$
                type: string
              jwksURL:
                description: |-
                  JWKSURL is where the issuer's signing keys are fetched from.
                  Defaults to the jwks_uri in the issuer's OpenID configuration.
                pattern: ^(https://.+|http://(localhost|127(\.[0-9]{1,3}){3}|\[::1\])(:[0-9]+)?([/?#].*)?)$
                type: string
              maxTokenAge:
                description: MaxTokenAge rejects tokens whose lifetime (exp - iat)
                  is longer. Defaults to 5m.
                type: string
                x-kubernetes-validations:
                - message: maxTokenAge must be a positive duration
                  rule: duration(self) > duration('0s')
            required:
            - audience
            - issuer
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
