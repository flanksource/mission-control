name: Build Binaries
on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the binaries, e.g. v1.2.3
        type: string
        required: false
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/build-binaries.yml
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: v1.26.x
          cache: false
      - name: Build UI
        run: make ui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: ui/frontend/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

  go-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: v1.26.x
          cache: false
      - name: Restore Go module cache
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum') }}
      - name: Download Go modules
        if: steps.cache.outputs.cache-hit != 'true'
        run: go mod download
      - name: Save Go module cache
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

  build:
    needs: [ui, go-mod]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64, faro_only: true }
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Go
        id: go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: v1.26.x
          cache: false
      - name: Restore Go module cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-
      - name: Restore Go build cache
        id: build-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ steps.go.outputs.go-version }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ steps.go.outputs.go-version }}-${{ matrix.goos }}-${{ matrix.goarch }}-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: ui/frontend/dist
      - name: Build incident-commander
        if: ${{ !matrix.faro_only }}
        run: make incident-commander-binary
      - name: Build faro
        run: make faro-binary
      - name: Save Go build cache
        if: steps.build-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Compress
        if: matrix.goos == 'linux'
        run: make compress-binary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            .bin/incident-commander_*
            .bin/faro_*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
