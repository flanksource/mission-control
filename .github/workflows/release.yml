name: Create Release
on:
  push:
    branches:
      - main

permissions: {} # start with no permission

jobs:
  create-release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: flanksource/action-workflows/.github/workflows/create-release.yml@6e3308211f3e1694e187ea2057c24978e5a01c2f
    secrets:
      token: ${{ secrets.FLANKBOT }}

  build-binaries:
    permissions:
      contents: read
    needs: create-release
    if: needs.create-release.outputs.published == 'true'
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: v${{ needs.create-release.outputs.version }}

  binary:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-binaries]
    if: needs.create-release.outputs.published == 'true'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: .release
          merge-multiple: true
      - name: Upload binaries to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.create-release.outputs.version }}" ./.release/* --clobber --repo "${{ github.repository }}"

  docker:
    needs: create-release
    if: needs.create-release.outputs.published == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: flanksource/action-workflows/.github/workflows/publish-multi-platform-docker-image.yml@c628197234fd2c4c3aebcb3c2b60dd399251adaf
    with:
      image_tags: |
        flanksource/incident-commander:latest
        flanksource/incident-commander:v${{ needs.create-release.outputs.version }}
        public.ecr.aws/k4y9r6y5/incident-commander:v${{ needs.create-release.outputs.version }}
      platforms: linux/amd64,linux/arm64
      build_args: |
        VERSION=v${{ needs.create-release.outputs.version }}
      login_to_ecr: true
      cache_mode: max
      cosign: true
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      aws_access_key_id: ${{ secrets.ECR_AWS_ACCESS_KEY }}
      aws_secret_access_key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
      token: ${{ secrets.GITHUB_TOKEN }}

  update-incident-commander-chart:
    if: needs.create-release.outputs.published == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [create-release, docker]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set version
        # Always use root git tags as semantic release can fail due to rate limit
        run: |
          git fetch --prune --unshallow
          echo "RELEASE_VERSION=$(git describe --abbrev=0 --tags --match 'v[0-9]*' | sed -e 's/^v//')" >> $GITHUB_ENV
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "${{ github.repository_owner }}/mission-control-chart"
          token: ${{ secrets.FLANKBOT }}
          path: ./incident-commander-chart
      - name: Update image tags in chart
        uses: mikefarah/yq@cb9793555487aafb501e1a9d85c28b812aeadfab # master
        with:
          cmd: yq -i e '.image.tag = "v${{ env.RELEASE_VERSION }}"' incident-commander-chart/chart/values.yaml
      - name: Update image tags in agent chart
        uses: mikefarah/yq@cb9793555487aafb501e1a9d85c28b812aeadfab # master
        with:
          cmd: yq -i e '.image.tag = "v${{ env.RELEASE_VERSION }}"' incident-commander-chart/agent-chart/values.yaml
      - name: Update CRDs
        run: |
          cp config/crds/* incident-commander-chart/chart/crds/
          cp config/crds/* incident-commander-chart/crd-chart/templates/
      - name: Push changes to chart repo
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "chore: update incident-commander image version to ${{ env.RELEASE_VERSION }}"
          repository: ./incident-commander-chart
          branch: main

  publish-release:
    if: needs.create-release.outputs.published == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, binary, docker, update-incident-commander-chart]
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.create-release.outputs.version }}" --draft=false --repo "${{ github.repository }}"
